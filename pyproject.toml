[project]
name = "tarkov-ops"
version = "0.1.0"
description = "Escape from Tarkov (PvE) progress, needs, stash and verdict service with an MCP interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
stash = ["opencv-python>=4.11", "watchdog>=6.0", "numpy>=2.1"]
mcp = ["mcp>=1.3"]
schedule = ["apscheduler>=3.11"]

[project.scripts]
tarkov-ops = "tarkov_ops.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-httpx>=0.35", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarkov_ops"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
